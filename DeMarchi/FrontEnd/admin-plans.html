<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Planos de Contas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚙️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="bg-gradient-to-r from-slate-900 via-indigo-900 to-blue-600 text-white">
    <div class="max-w-7xl mx-auto px-4 py-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Administração - Planos de Contas</h1>
        <p class="text-sm text-blue-100">CRUD de planos e tetos centralizados</p>
      </div>
      <div class="flex items-center gap-2">
        <input id="jwt" type="password" placeholder="JWT Token" class="border border-blue-300 bg-white text-gray-900 p-2 rounded w-72" />
        <button id="btnLoad" class="bg-white text-blue-700 px-4 py-2 rounded">Carregar</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto py-6 px-4">
    <!-- Filtros -->
    <section class="bg-white shadow rounded p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <div class="md:col-span-3">
          <label class="text-xs text-gray-500">Buscar</label>
          <input id="filter-q" type="text" class="border p-2 rounded w-full" placeholder="Código, nome ou descrição...">
        </div>
        <div>
          <label class="text-xs text-gray-500">Tipo</label>
          <select id="filter-type" class="border p-2 rounded w-full">
            <option value="ALL">Todos</option>
            <option value="personal">Pessoal</option>
            <option value="business">Empresarial</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="apply-filters" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Aplicar</button>
        </div>
      </div>
    </section>

    <section class="bg-white shadow rounded">
      <div class="px-4 py-3 border-b flex items-center justify-between">
        <h2 class="text-lg font-semibold">Planos</h2>
        <div class="flex items-center gap-2">
          <span id="result-count" class="text-sm text-gray-500">0 resultados</span>
          <button id="btnAdd" class="bg-green-600 text-white px-3 py-2 rounded">Novo Plano</button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead class="bg-gray-100">
            <tr>
              <th id="th-id" class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer">Código</th>
              <th id="th-name" class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer">Nome</th>
              <th id="th-description" class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer">Descrição</th>
              <th id="th-type" class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer">Tipo</th>
              <th id="th-budget" class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer">Teto (R$)</th>
              <th class="px-3 py-2 text-right text-xs font-medium text-gray-500 uppercase">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-t bg-gray-50">
        <div class="flex items-center space-x-2">
          <label class="text-sm text-gray-600">Itens por página</label>
          <select id="page-size" class="border p-1 rounded text-sm">
            <option>10</option>
            <option selected>25</option>
            <option>50</option>
            <option>100</option>
          </select>
        </div>
        <div class="flex items-center space-x-3">
          <button id="page-prev" class="px-3 py-1 border rounded text-sm">Anterior</button>
          <span id="page-info" class="text-sm text-gray-600">Página 1 de 1</span>
          <button id="page-next" class="px-3 py-1 border rounded text-sm">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Drawer Novo/Editar Plano -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black bg-opacity-40 hidden opacity-0" onclick="closePlanDrawer()"></div>
  <aside id="drawer" class="fixed top-0 right-0 h-full w-full sm:w-[440px] bg-white shadow-2xl p-5 translate-x-full transition-transform" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-4">
      <h3 id="drawer-title" class="text-xl font-semibold">Novo Plano</h3>
      <button class="text-gray-500 hover:text-gray-700" onclick="closePlanDrawer()">✕</button>
    </div>
    <form id="plan-form" onsubmit="handleSavePlan(event)">
      <div class="mb-3">
        <label class="block text-sm text-gray-600 mb-1">Código</label>
        <input id="plan-id" type="number" class="border p-2 rounded w-full" required>
      </div>
      <div class="mb-3">
        <label class="block text-sm text-gray-600 mb-1">Nome</label>
        <input id="plan-name" type="text" class="border p-2 rounded w-full" required>
      </div>
      <div class="mb-3">
        <label class="block text-sm text-gray-600 mb-1">Descrição</label>
        <input id="plan-description" type="text" class="border p-2 rounded w-full">
      </div>
      <div class="mb-3">
        <label class="block text-sm text-gray-600 mb-1">Tipo</label>
        <select id="plan-type" class="border p-2 rounded w-full">
          <option value="personal">Pessoal</option>
          <option value="business">Empresarial</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="block text-sm text-gray-600 mb-1">Teto (R$)</label>
        <input id="plan-budget" type="number" step="0.01" min="0" class="border p-2 rounded w-full" required>
      </div>
      <div class="mt-4 flex justify-end space-x-2">
        <button type="button" class="px-4 py-2 rounded border" onclick="closePlanDrawer()">Cancelar</button>
        <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white">Salvar</button>
      </div>
    </form>
  </aside>

  <script src="config.js"></script>
  <script>
    // Define a URL do backend de forma robusta, com fallback e override por query string
    (function(){
      const urlParams = new URLSearchParams(window.location.search);
      const override = urlParams.get('apiBase');
      const cfg = window.CONFIG || {};
      const frontendOrigin = cfg.FRONTEND_URL || window.location.origin;
      let base = override || cfg.API_BASE_URL || '';
      if (!/^https?:\/\//.test(base) || base === frontendOrigin) {
        base = 'https://backend-production-a867.up.railway.app';
      }
      window.__ADMIN_API_BASE__ = base;
      console.log('Admin API base:', window.__ADMIN_API_BASE__);
    })();
    const API_BASE_URL = window.__ADMIN_API_BASE__;

    const state = {
      plans: [],
      sort: { key: 'id', dir: 'asc' },
      pagination: { page: 1, pageSize: 25 },
      filters: { q: '', type: 'ALL' },
      editingId: null
    };

    // Autofill do JWT e auto-carregamento
    (function initJwtPrefill(){
      try {
        const stored = localStorage.getItem('token') || sessionStorage.getItem('token');
        const inp = document.getElementById('jwt');
        if (stored && inp) {
          inp.value = stored;
          // Auto carregar após pequeno delay para garantir DOM pronto
          setTimeout(() => { const btn = document.getElementById('btnLoad'); btn && btn.click(); }, 200);
        }
      } catch(e) {}
    })();

    function rowTemplate(p){
      return `<tr>
        <td class="px-3 py-2 text-sm text-gray-700">${p.id}</td>
        <td class="px-3 py-2"><input data-id="${p.id}" data-k="name" value="${p.name||''}" class="border p-1 rounded w-full text-sm"/></td>
        <td class="px-3 py-2"><input data-id="${p.id}" data-k="description" value="${p.description||''}" class="border p-1 rounded w-full text-sm"/></td>
        <td class="px-3 py-2">
          <select data-id="${p.id}" data-k="type" class="border p-1 rounded text-sm">
            <option value="personal" ${p.type==='personal'?'selected':''}>Pessoal</option>
            <option value="business" ${p.type==='business'?'selected':''}>Empresarial</option>
          </select>
        </td>
        <td class="px-3 py-2"><input type="number" step="0.01" min="0" data-id="${p.id}" data-k="defaultBudget" value="${p.defaultBudget||0}" class="border p-1 rounded w-32 text-sm"/></td>
        <td class="px-3 py-2 text-right space-x-2">
          <button data-act="save" data-id="${p.id}" class="bg-blue-600 text-white px-2 py-1 rounded text-sm">Salvar</button>
          <button data-act="delete" data-id="${p.id}" class="bg-red-600 text-white px-2 py-1 rounded text-sm">Excluir</button>
        </td>
      </tr>`;
    }

    async function loadPlans(){
      const jwt = document.getElementById('jwt').value.trim();
      if(!jwt) return alert('Informe o JWT');
      const resp = await fetch(`${API_BASE_URL}/api/admin/chart-of-accounts`, { headers: { Authorization: `Bearer ${jwt}` } });
      if(resp.status === 404){
        // Fallback: listar via endpoint público somente leitura
        const pub = await fetch(`${API_BASE_URL}/api/config/chart-of-accounts`, { credentials: 'include' });
        if(!pub.ok){
          const tt = await pub.text();
          return alert('Admin GET 404 e leitura pública falhou: ' + tt);
        }
        const data = await pub.json();
        state.plans = (data && data.plans) || [];
        renderPlans();
        return alert('Aviso: endpoints admin não estão no backend atual (404). Mostrando lista pública somente leitura. Faça deploy do backend atualizado para habilitar CRUD.');
      }
      if(!resp.ok){
        const t = await resp.text();
        return alert('Erro ao carregar: ' + t);
      }
      const json = await resp.json();
      state.plans = json.plans || [];
      renderPlans();
    }

    async function upsertPlan(plan){
      const jwt = document.getElementById('jwt').value.trim();
      const resp = await fetch(`${API_BASE_URL}/api/admin/chart-of-accounts/plan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwt}` },
        body: JSON.stringify(plan)
      });
      if(resp.status === 404){ throw new Error('Endpoints admin não encontrados (404). Faça deploy do backend com as novas rotas.'); }
      if(!resp.ok){ const t = await resp.text(); throw new Error(t); }
      return resp.json();
    }

    async function deletePlan(id){
      const jwt = document.getElementById('jwt').value.trim();
      const resp = await fetch(`${API_BASE_URL}/api/admin/chart-of-accounts/plan/${id}`, {
        method: 'DELETE', headers: { Authorization: `Bearer ${jwt}` }
      });
      if(resp.status === 404){ throw new Error('Endpoints admin não encontrados (404). Faça deploy do backend com as novas rotas.'); }
      if(!resp.ok){ const t = await resp.text(); throw new Error(t); }
      return resp.json();
    }

    document.getElementById('btnLoad').addEventListener('click', loadPlans);

    // CRUD UI Helpers
    function getFilters(){
      state.filters.q = document.getElementById('filter-q').value.trim();
      state.filters.type = document.getElementById('filter-type').value;
      return state.filters;
    }
    function applyFilters(plans){
      const { q, type } = state.filters;
      const ql = (q||'').toLowerCase();
      return plans.filter(p =>
        (!q || String(p.id).includes(q) || (p.name||'').toLowerCase().includes(ql) || (p.description||'').toLowerCase().includes(ql)) &&
        (type==='ALL' || (p.type||'').toLowerCase()===type)
      );
    }
    function setSort(key){
      if (state.sort.key===key) state.sort.dir = state.sort.dir==='asc'?'desc':'asc'; else { state.sort.key=key; state.sort.dir = key==='id'?'asc':'asc'; }
      renderPlans();
    }
    function sortPlans(plans){
      const { key, dir } = state.sort; const mul = dir==='asc'?1:-1;
      return plans.slice().sort((a,b)=>{
        let va, vb;
        switch(key){
          case 'id': va=Number(a.id); vb=Number(b.id); break;
          case 'name': va=(a.name||'').toLowerCase(); vb=(b.name||'').toLowerCase(); return va<vb?-1*mul:va>vb?1*mul:0;
          case 'description': va=(a.description||'').toLowerCase(); vb=(b.description||'').toLowerCase(); return va<vb?-1*mul:va>vb?1*mul:0;
          case 'type': va=(a.type||'').toLowerCase()==='business'?1:0; vb=(b.type||'').toLowerCase()==='business'?1:0; break;
          case 'budget': va=Number(a.defaultBudget||0); vb=Number(b.defaultBudget||0); break;
          default: va=0; vb=0;
        }
        return (va - vb)*mul;
      });
    }
    function renderPlans(){
      getFilters();
      const filtered = applyFilters(state.plans);
      const sorted = sortPlans(filtered);
      const total = sorted.length;
      const size = state.pagination.pageSize;
      const pages = Math.max(1, Math.ceil(total/size));
      state.pagination.page = Math.min(state.pagination.page, pages);
      const start = (state.pagination.page-1)*size;
      const paged = sorted.slice(start, start+size);
      document.getElementById('tbody').innerHTML = paged.map(rowTemplate).join('');
      document.getElementById('result-count').textContent = `${total} resultados`;
      const pageInfo = document.getElementById('page-info');
      if (pageInfo) pageInfo.textContent = `Página ${state.pagination.page} de ${pages}`;
      document.getElementById('page-prev').disabled = state.pagination.page<=1;
      document.getElementById('page-next').disabled = state.pagination.page>=pages;
    }

    // Drawer handlers
    function openPlanDrawer(editPlan){
      const overlay = document.getElementById('drawer-overlay');
      const drawer = document.getElementById('drawer');
      const title = document.getElementById('drawer-title');
      state.editingId = editPlan? editPlan.id : null;
      title.textContent = editPlan? `Editar Plano ${editPlan.id}` : 'Novo Plano';
      document.getElementById('plan-id').value = editPlan? editPlan.id : '';
      document.getElementById('plan-name').value = editPlan? (editPlan.name||'') : '';
      document.getElementById('plan-description').value = editPlan? (editPlan.description||'') : '';
      document.getElementById('plan-type').value = editPlan? (editPlan.type||'personal') : 'personal';
      document.getElementById('plan-budget').value = editPlan? (Number(editPlan.defaultBudget)||0) : 0;
      overlay.classList.remove('hidden');
      setTimeout(()=>{ overlay.classList.remove('opacity-0'); drawer.classList.remove('translate-x-full'); }, 10);
    }
    function closePlanDrawer(){
      const overlay = document.getElementById('drawer-overlay');
      const drawer = document.getElementById('drawer');
      overlay.classList.add('opacity-0');
      drawer.classList.add('translate-x-full');
      setTimeout(()=> overlay.classList.add('hidden'), 200);
    }
    window.closePlanDrawer = closePlanDrawer; // expose to onclick

    async function handleSavePlan(e){
      e.preventDefault();
      const plan = {
        id: Number(document.getElementById('plan-id').value),
        name: document.getElementById('plan-name').value.trim(),
        description: document.getElementById('plan-description').value.trim(),
        type: document.getElementById('plan-type').value,
        defaultBudget: Number(document.getElementById('plan-budget').value||0)
      };
      if (!plan.id || !plan.name || plan.defaultBudget<0) { alert('Preencha código, nome e teto válido.'); return; }
      try { await upsertPlan(plan); closePlanDrawer(); await loadPlans(); } catch(err){ alert('Erro ao salvar: '+err.message); }
    }
    window.handleSavePlan = handleSavePlan;

    document.getElementById('btnAdd').addEventListener('click', ()=> openPlanDrawer(null));
    document.getElementById('apply-filters').addEventListener('click', ()=>{ state.pagination.page=1; renderPlans(); });
    document.getElementById('page-size').addEventListener('change', (e)=>{ state.pagination.pageSize=Number(e.target.value)||25; state.pagination.page=1; renderPlans(); });
    document.getElementById('page-prev').addEventListener('click', ()=>{ if(state.pagination.page>1){ state.pagination.page--; renderPlans(); } });
    document.getElementById('page-next').addEventListener('click', ()=>{ state.pagination.page++; renderPlans(); });
    document.getElementById('th-id').addEventListener('click', ()=> setSort('id'));
    document.getElementById('th-name').addEventListener('click', ()=> setSort('name'));
    document.getElementById('th-description').addEventListener('click', ()=> setSort('description'));
    document.getElementById('th-type').addEventListener('click', ()=> setSort('type'));
    document.getElementById('th-budget').addEventListener('click', ()=> setSort('budget'));

    document.getElementById('tbody').addEventListener('click', async (e) => {
      const act = e.target.getAttribute('data-act');
      const id = e.target.getAttribute('data-id');
      if(!act || !id) return;
      if(act === 'save'){
        const inputs = document.querySelectorAll(`[data-id="${id}"][data-k]`);
        const plan = { id: Number(id) };
        inputs.forEach(inp => {
          const k = inp.getAttribute('data-k');
          plan[k] = k === 'defaultBudget' ? Number(inp.value || 0) : inp.value;
        });
        try { await upsertPlan(plan); await loadPlans(); } catch(e){ alert('Erro ao salvar: ' + e.message); }
      } else if (act === 'delete'){
        if(!confirm('Excluir plano ' + id + '?')) return;
        try { await deletePlan(id); await loadPlans(); } catch(e){ alert('Erro ao excluir: ' + e.message); }
      }
    });
  </script>
</body>
</html>
